[project]
name = "ORMwORM"
dynamic = ["version"]
description = "An ORM that just works."
authors = [{ name = "Emelianov Artem", email = "penguin5726@proton.me" }]
dependencies = []
requires-python = ">=3.14"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Pukhosos/ORMwORM"
Repository = "https://github.com/Pukhosos/ORMwORM"
Issues = "https://github.com/Pukhosos/ORMwORM/issues"

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pre-commit",
]
test = [
    "pytest",
    "pytest-env",
    "pytest-randomly",
    "pytest-xdist",
    "hypothesis",
    "hypofuzz",
]

[build-system]
requires = [
    "setuptools>=77.0",
    "setuptools-scm",
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
tag_regex = "^v(?P<version>\\d+\\.\\d+\\.\\d+)$"
parentdir_prefix_version = "ORMwORM-"
fallback_version = "0.0.0"
version_file = "src/ormworm/_version.py"
write_to_source = true

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint.isort]
force-single-line = false
combine-as-imports = true
force-sort-within-sections = true
known-first-party = ["ormworm"]

[tool.ruff.format]
quote-style = "single"
skip-magic-trailing-comma = false
docstring-code-format = true
line-ending = "lf"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "A",
    "C4",
    "SIM",
    "N",
    "UP",
    "ANN",
    "ASYNC",
    "RUF",
    "S",
    "D",
    "PL",
    "PT",
    "T20",
    "DTZ",
    "ERA",
    "TID",
    "PERF",
    "FURB",
]
ignore = [
    "D202",
    "D203",
    "D212",
    "PT013",
    "W293",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "D100",
    "D101",
    "D102",
    "D104",
    "S101",
]

[tool.mypy]
python_version = "3.14"
files = ["src", "tests"]
mypy_path = ["src", "tests"]
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_return_any = true
warn_unreachable = true
allow_untyped_globals = false
allow_redefinition = false
extra_checks = true
implicit_reexport = false
strict_equality = true
strict_bytes = true
show_error_context = true
show_column_numbers = true
show_error_code_links = true
pretty = true
error_summary = true
warn_incomplete_stub = true

[tool.pytest.ini_options]
minversion = "9.0"
env = ["PYTEST__IS_RUNNING=1"]
addopts = [
    "-ra",
    "-q",
    "-l",
    "--doctest-modules",
    "--doctest-glob=*.md",
]
markers = [
    "doctest_only: run only when the --doctest-only flag is set."
]
pythonpath = ["src"]
testpaths = ["."]
norecursedirs = [
    "__pycache__",
    ".git",
    ".hypothesis",
    ".mypy_cache",
    ".pytest_cache",
    ".venv",
    "build",
    "dist",
]
strict = true
truncation_limit_chars = 0
truncation_limit_lines = 0
